[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-api-source"
version = "0.1.0"
description = "Spark 4.0 Python Data Source for paginated public-data APIs"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[tool.setuptools]
packages = ["public_api_source"]
