# 예시 템플릿입니다. 실제 값을 넣어 커밋하지 마세요.
# 실제 생성은 scripts/refresh-aws-secret.sh 를 사용합니다 (현재 aws 세션의 임시 자격 증명 사용).
apiVersion: v1
kind: Secret
metadata:
  name: aws-s3-credentials
  namespace: spark-jobs
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "<access-key-id>"
  AWS_SECRET_ACCESS_KEY: "<secret-access-key>"
  AWS_SESSION_TOKEN: "<session-token>"   # 임시 자격 증명일 때만
  AWS_REGION: "ap-northeast-2"
